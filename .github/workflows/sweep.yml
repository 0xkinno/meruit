name: Sweep abandoned channels
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}
jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Call the sweeper
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS -X POST -H "authorization: Bearer ${CRON_SECRET}" https://meruit.vercel.app/api/cron/sweep
