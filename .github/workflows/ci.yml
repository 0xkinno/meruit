name: CI
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run check:copy
      - run: npm run facts:check
      - run: npm run build
        env:
          NEXT_PUBLIC_NETWORK: devnet
      - name: Browser checks (viewports, axe, wallet)
        run: |
          npx playwright install --with-deps chromium
          NEXT_PUBLIC_NETWORK=devnet MERUIT_STORE=memory npx next start -p 3112 &
          sleep 6
          PW_CHROMIUM="$(node -e "console.log(require('playwright').chromium.executablePath())")" npx playwright test tests/e2e/viewports.spec.ts --trace off --workers 2
